name: Build & Publish LaTeX Manuscripts

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Monograph & Individual Manuscripts
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          root_file: |
            master_monograph.tex
            master_entry.tex
            paper_1_physics.tex
            paper_2_logic.tex
            paper_3_social.tex
            paper_4_ai_aie.tex
            paper_5_hermeneutics.tex

      - name: Upload PDF Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Manuscripts
          path: latex/*.pdf